<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CyberSafe Store - Registro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
  >
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top left, #1e293b, #020617);
      color: #e5e7eb;
    }
    .card {
      background-color: #020617;
      border-radius: 1.2rem;
      border: 1px solid rgba(148,163,184,.4);
      box-shadow: 0 20px 40px rgba(15,23,42,.9);
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-black bg-opacity-75">
    <div class="container">
      <a class="navbar-brand" href="/">CyberSafe Store</a>
      <span class="navbar-text" id="userStatus">No autenticado</span>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <h1 class="h4 mb-3">Crear cuenta</h1>
        <div id="mainMsg" class="alert d-none" role="alert"></div>
        <div class="card p-3 p-md-4">
          <div class="mb-3">
            <label for="regEmail" class="form-label">Correo electrónico</label>
            <input id="regEmail" type="email" class="form-control">
          </div>
          <div class="mb-3">
            <label for="regPassword" class="form-label">Contraseña</label>
            <input id="regPassword" type="password" class="form-control">
          </div>
          <button id="btnRegister" class="btn btn-secondary w-100">
            Registrarme
          </button>
          <div id="regMsg" class="mt-2 small text-secondary"></div>
        </div>
        <p class="mt-3 small text-secondary">
          ¿Ya tienes cuenta? <a href="/auth/login.html">Inicia sesión aquí</a>.
        </p>
      </div>
    </div>
  </main>

  <script src="/js/main.js" defer></script>
  <script src="/js/auth.js" defer></script>
</body>
</html>
